name: Android module checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check architecture and release scripts
        run: |
          python3 scripts/check_module_boundaries.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test JVM session runtime
        run: ./gradlew :journey:domain:test --no-daemon --stacktrace
      - name: Prepare Firebase configuration when available
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Firebase configuration is unavailable; JVM and architecture checks still run. Android checks are required in release CI.'
          fi
      - name: Test Android modules and lint
        if: steps.firebase.outputs.available == 'true'
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace
