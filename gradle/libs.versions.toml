[versions]
# Android Studio Panda 2(2025.3.2)는 AGP 9.1까지, compileSdk 37은 AGP 9.1.1 이상이 필요하다.
# 지금은 Studio 호환을 위해 AGP 8.13 + compileSdk 36 조합을 쓴다.
agp = "8.13.2"
kotlin = "2.2.10"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
compose = "1.11.0"
window = "1.5.0"
billing = "9.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
