[versions]
# Android Studio Panda 2(2025.3.2)는 AGP 9.1까지, compileSdk 37은 AGP 9.1.1 이상이 필요하다.
# 지금은 Studio 호환을 위해 AGP 8.13 + compileSdk 36 조합을 쓴다.
agp = "8.13.2"
kotlin = "2.2.10"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
compose = "1.11.0"
window = "1.5.0"
billing = "9.1.0"
# 35.x는 2026-10 출시라 아직 쓰지 않는다. 34.19.0 = Analytics 23.2.0 · Crashlytics 20.1.1.
firebaseBom = "34.19.0"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"

[libraries]
junit = { module = "junit:junit", version = "4.13.2" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
